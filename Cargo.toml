[workspace]
resolver = "2"
members = [
    "crates/op-core",
    "crates/op-cards",
    "crates/op-ai",
    "crates/op-cli",
    "crates/op-desktop",
    "crates/op-ingest",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/mcsantiago/rusty-d-luffy"
# The licence covers this source only. Card data and artwork belong to their
# respective owners and are neither vendored nor redistributed; see NOTICE.


[workspace.dependencies]
op-core = { path = "crates/op-core" }
op-cards = { path = "crates/op-cards" }
op-ai = { path = "crates/op-ai" }
op-ingest = { path = "crates/op-ingest" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
thiserror = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
