name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings; the tree is currently warning-free and it is
  # much cheaper to keep it that way than to clean it up later.
  RUSTFLAGS: -D warnings

jobs:
  # Whether a pull request can affect the desktop bundles. Only `bundle` asks;
  # everything else runs on every change regardless.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              # Rust and the Tauri config, the icon set, and the bundle
              # settings all live here.
              - 'crates/op-desktop/**'
              # `frontendDist` points at these files directly; they are what
              # gets packaged.
              - 'client/**'
              # A tauri or tauri-build bump reaches the bundler without
              # touching either directory above.
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  # Cheap checks, once. No need to lint the same code on three OSes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential curl file patchelf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

      # Card scripts are written as Rust builders, which reads well one card at
      # a time and not at all in aggregate. The dump is a reviewable data form
      # of the whole set, and a working sample of the format a runtime loader
      # would have to accept. It needs no `data/` — scripts are compiled in.
      - name: Dump card scripts
        run: cargo run -p op-cards --bin dump-scripts -- card-scripts.json
      - uses: actions/upload-artifact@v4
        with:
          name: card-scripts
          path: card-scripts.json
          retention-days: 7

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential curl file patchelf

      # The card-level tests skip themselves without data/, so fetching is what
      # makes them meaningful. Card data only — the art is ~750 MB and no test
      # reads a single image.
      # The pack list comes from the built-in decks rather than being typed
      # here, so a newly scripted set is fetched because it is playable. Typing
      # it is what left ST-04 and ST-08 without data, failing their tests with
      # `UnknownCard` rather than skipping them.
      - name: Fetch card data
        # Explicit, because Windows runners default to PowerShell and the
        # command substitution below is bash.
        shell: bash
        run: |
          PACKS=$(cargo run -q --release -p op-cards --bin packs)
          echo "fetching packs: $PACKS"
          cargo run --release -p op-ingest --bin op-fetch -- --data-dir data --packs $PACKS

      # Release, not debug: the ISMCTS strength matches are ~200s optimised and
      # do not finish in a reasonable time unoptimised.
      - name: Test
        run: cargo test --workspace --release

  # Proves the desktop app actually bundles on every target, which is the thing
  # a release depends on and the thing most likely to break silently.
  #
  # `test` already compiles op-desktop on all three OSes — it is a workspace
  # member — so what this adds over that is the packaging layer: the Tauri
  # config, the icons, and the installer tooling (WiX, dmg, deb/AppImage).
  # None of that can be reached by a change that touches neither the desktop
  # crate nor what it packages, so a pull request that does not is spared the
  # three jobs. Anything landing on main is bundled regardless, so the packaged
  # form of every commit released from is still proven.
  bundle:
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary is built from both halves, so both targets have
          # to be installed even though the runner is one of them.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential curl file patchelf

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/op-desktop
          # Build only; releasing is the release workflow's job.
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: |
            target/release/bundle/**
            target/universal-apple-darwin/release/bundle/**
          if-no-files-found: warn
          retention-days: 7
