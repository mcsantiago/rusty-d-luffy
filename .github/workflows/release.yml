name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal binary rather than two, so Intel and Apple Silicon
          # users download the same file.
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential curl file patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/op-desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: OnePieceSim ${{ github.event.inputs.tag || github.ref_name }}
          # Drafted, not published: the binaries are unsigned, so the release
          # notes need to explain the Gatekeeper and SmartScreen warnings before
          # anyone downloads them.
          releaseDraft: true
          prerelease: true
          releaseBody: |
            Card data and art are **not bundled**. On first run the app fetches
            them from the official card list; this takes a few minutes once,
            after which it runs offline.

            The binaries are **unsigned**.

            - **macOS** — Gatekeeper will refuse to open it. Right-click the app
              and choose Open, then Open again.
            - **Windows** — SmartScreen will warn. More info, then Run anyway.
            - **Linux** — `.deb` and `.AppImage`. The AppImage needs
              `chmod +x`.

            Not affiliated with, endorsed by, or sponsored by Bandai.
          args: ${{ matrix.args }}
